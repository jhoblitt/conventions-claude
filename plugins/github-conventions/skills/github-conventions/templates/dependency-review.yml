# Managed by github-conventions (references/security.md); converge rewrites it.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action needs the dependency graph, which a private repository has
    # only with GitHub Advanced Security; without it the step errors rather
    # than passing, so the job stands down instead of reporting a false red.
    if: github.event.repository.private == false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v5

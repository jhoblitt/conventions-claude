name: workflow-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v7
        with:
          persist-credentials: false

      - name: Verify every action is pinned to a full commit SHA
        run: |
          fail=0
          while IFS= read -r ref; do
            case "$ref" in
              ./*|.|docker://*) continue ;;
            esac
            sha=${ref##*@}
            if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::not SHA-pinned: $ref"
              fail=1
            fi
          done < <(grep -rhoE '^\s*(-\s*)?uses:\s*\S+' .github/ | sed -E 's/.*uses:\s*//')
          [ "$fail" -eq 0 ] && echo "All action refs are SHA-pinned."
          exit "$fail"

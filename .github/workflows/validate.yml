name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/code-conventions
          claude plugin validate --strict plugins/github-conventions
          claude plugin validate --strict plugins/go-conventions

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/github-conventions/tools/go.mod
          check-latest: true
          cache: false

      # The Makefile is the one home of the golangci-lint version; the action
      # only installs that binary, and `make check` runs it like a developer.
      - name: Read the pinned golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(make -s print-golangci-version)" >> "$GITHUB_ENV"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: make check
        run: make check

      - name: shellcheck
        env:
          # Pinned so CI and a contributor's local run agree. The runner image
          # ships its own shellcheck and bumps it without warning: an older one
          # rejected `[ a ] && [ b ] || c` under SC2015 that 0.11.0 accepts,
          # having learned the third command exits. Bump by hand, with the
          # checksum.
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tmp=$(mktemp -d)
          name="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tmp/$name" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${name}"
          echo "${SHELLCHECK_SHA256}  $tmp/$name" | sha256sum -c -
          tar -xJf "$tmp/$name" -C "$tmp" --strip-components=1 \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          "$tmp/shellcheck" --version
          find .github/scripts evals tests plugins -name '*.sh' -print0 | xargs -0 "$tmp/shellcheck"

      - name: Hook launcher contract
        run: bash tests/goconv-hook-test.sh

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Templates and live copies agree
        run: .github/scripts/dogfood-sync.sh

      - name: Every reference pointer resolves
        run: .github/scripts/check-refs.sh

      - name: README diagrams render
        # The runner blocks unprivileged user namespaces, so the bundled
        # Chrome cannot start its own sandbox; the browser only renders
        # markdown we wrote, in a throwaway job.
        run: |
          printf '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          npx --yes @mermaid-js/mermaid-cli@11 \
            --puppeteerConfigFile "$RUNNER_TEMP/puppeteer.json" \
            -i README.md -o "$RUNNER_TEMP/readme-check.md"

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One job per module: the action reads a single go.mod.
    strategy:
      fail-fast: false
      matrix:
        module:
          - plugins/github-conventions/tools
          - plugins/go-conventions/tools
          - plugins/go-conventions/hooks/goconv-hook
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          work-dir: ${{ matrix.module }}
          go-package: ./...
